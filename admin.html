<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sky Scribe — Admin</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #05060d;
    color: var(--text-primary, #d8d8e8);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #sky-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 0;
  }
  #sky-wrap {
    position: relative;
    height: 100%;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    overflow: hidden;
    background: #02020a;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
  }
  #sky {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  #controls {
    width: 340px;
    flex-shrink: 0;
    height: 100%;
    overflow-y: auto;
    padding: 28px 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    border-left: 1px solid rgba(80, 80, 130, 0.2);
    background: rgba(8, 10, 22, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #controls h1 {
    font-weight: 200;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--text-primary, #d8d8e8);
  }
  #controls h1 .sub {
    display: block;
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--text-muted, #8080a0);
    margin-top: 6px;
  }
  .group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .group-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .group-row > * { flex: 1 1 auto; min-width: 0; }
  button {
    background: rgba(20, 22, 40, 0.55);
    border: 1px solid rgba(120, 120, 180, 0.4);
    color: var(--text-primary, #d8d8e8);
    padding: 9px 14px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }
  button:hover:not(:disabled) { border-color: rgba(200, 200, 240, 0.65); }
  button:active:not(:disabled) { background: rgba(40, 42, 70, 0.7); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary {
    background: rgba(40, 60, 30, 0.55);
    border-color: rgba(140, 220, 130, 0.5);
    color: #d8f0c8;
  }
  button.primary:hover:not(:disabled) { border-color: rgba(180, 240, 160, 0.85); }
  button.danger {
    background: rgba(60, 22, 30, 0.55);
    border-color: rgba(200, 100, 110, 0.45);
    color: #f0c8c8;
  }
  button.danger:hover:not(:disabled) { border-color: rgba(240, 140, 150, 0.8); }
  .group-title {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-muted, #8080a0);
    margin: 4px 0 -2px;
  }
  #detail {
    border: 1px solid rgba(120, 120, 180, 0.2);
    border-radius: 6px;
    padding: 12px 14px;
    background: rgba(15, 17, 35, 0.5);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #detail.hidden { display: none; }
  #detail .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  #detail .head .label {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted, #8080a0);
  }
  #detail .head .id {
    font-size: 14px;
    color: #ffd88a;
    letter-spacing: 0.06em;
  }
  #detail label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted, #8080a0);
  }
  #detail input[type="number"] {
    background: rgba(8, 10, 22, 0.7);
    border: 1px solid rgba(120, 120, 180, 0.3);
    color: var(--text-primary, #d8d8e8);
    padding: 7px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  #detail input[type="number"]:focus {
    outline: none;
    border-color: rgba(255, 220, 130, 0.7);
  }
  #meta {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--text-muted, #8080a0);
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: auto;
  }
  #meta .row { display: flex; justify-content: space-between; }
  #meta .row strong { color: var(--text-primary, #d8d8e8); font-weight: 500; }
  #timeline-area {
    height: 200px;
    flex-shrink: 0;
    border-top: 1px solid rgba(80, 80, 130, 0.25);
    background: rgba(8, 10, 22, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
  }
  #tl-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(80, 80, 130, 0.15);
    flex-shrink: 0;
  }
  #tl-toolbar .label {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-muted, #8080a0);
  }
  #tl-toolbar .zoom-btn {
    padding: 4px 10px;
    font-size: 14px;
    letter-spacing: 0;
    line-height: 1;
  }
  #tl-toolbar .hint {
    font-size: 11px;
    color: var(--text-muted, #8080a0);
    letter-spacing: 0.04em;
    margin-left: auto;
  }
  #tl-scroll {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    position: relative;
  }
  #tl-scroll::-webkit-scrollbar { height: 8px; }
  #tl-scroll::-webkit-scrollbar-thumb {
    background: rgba(120, 120, 180, 0.35);
    border-radius: 4px;
  }
  #tl-scroll::-webkit-scrollbar-track { background: transparent; }
  #timeline {
    display: block;
    height: 100%;
    cursor: pointer;
  }
  /* Fullscreen mode: hide everything except the sky-wrap. The wrap fills the
     viewport with the sky background, but the canvas stays a centered square
     so its aspect ratio is preserved. */
  #sky-wrap:fullscreen {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
    max-width: none;
    max-height: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sky-wrap:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
    max-width: none;
    max-height: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sky-wrap:fullscreen #sky,
  #sky-wrap:-webkit-full-screen #sky {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    flex: 0 0 auto;
  }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="sky-area">
      <div id="sky-wrap">
        <canvas id="sky"></canvas>
      </div>
    </div>
    <aside id="controls">
      <h1>Sky Scribe<span class="sub">Admin</span></h1>

      <div class="group">
        <div class="group-title">Playback</div>
        <button id="play-btn" class="primary" type="button">▶ Play</button>
        <div class="group-row">
          <button id="rewind-btn" type="button">Rewind</button>
          <button id="mute-btn" type="button" aria-pressed="false">🔊 Mute</button>
          <button id="fullscreen-btn" type="button">Fullscreen</button>
        </div>
      </div>

      <div class="group">
        <div class="group-title">Snapshots</div>
        <button id="snapshot-btn" type="button">+ Capture snapshot</button>
        <button id="revert-btn" type="button">Revert edits</button>
        <button id="randomize-btn" type="button">Randomize stars</button>
      </div>

      <div class="group">
        <div class="group-title">Score file</div>
        <div class="group-row">
          <button id="save-btn" type="button">Save</button>
          <button id="load-btn" type="button">Load</button>
          <input type="file" id="load-input" accept="application/json,.json" style="display:none">
        </div>
      </div>

      <div id="detail" class="hidden">
        <div class="head">
          <span class="label">Selected snapshot</span>
          <span class="id" id="detail-id">#1</span>
        </div>
        <label>
          Hold (s)
          <input type="number" id="hold-input" min="0" step="0.5" value="10">
        </label>
        <label>
          Transition to next (s)
          <input type="number" id="trans-input" min="0" step="0.5" value="30">
        </label>
        <div class="group-row">
          <button id="move-left-btn" type="button">← Move left</button>
          <button id="move-right-btn" type="button">Move right →</button>
        </div>
        <div class="group-row">
          <button id="duplicate-btn" type="button">Duplicate</button>
          <button id="delete-btn" class="danger" type="button">Delete</button>
        </div>
      </div>

      <div id="meta">
        <div class="row"><span>Snapshots</span><strong id="meta-count">0</strong></div>
        <div class="row"><span>Time</span><strong id="meta-time">0:00 / 0:00</strong></div>
      </div>
    </aside>
  </div>
  <div id="timeline-area">
    <div id="tl-toolbar">
      <span class="label">Timeline</span>
      <button class="zoom-btn" id="zoom-out-btn" type="button">−</button>
      <button class="zoom-btn" id="zoom-in-btn" type="button">+</button>
      <span class="hint">click top strip to set playhead · click marker to edit · drag marker to reorder · drag stars to update live state</span>
    </div>
    <div id="tl-scroll">
      <canvas id="timeline"></canvas>
    </div>
  </div>
</div>

<script>
(() => {
  // ====== DOM ======
  const sky = document.getElementById('sky');
  const skyCtx = sky.getContext('2d');
  const tlCanvas = document.getElementById('timeline');
  const tlCtx = tlCanvas.getContext('2d');
  const tlScroll = document.getElementById('tl-scroll');

  const playBtn = document.getElementById('play-btn');
  const rewindBtn = document.getElementById('rewind-btn');
  const muteBtn = document.getElementById('mute-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const snapshotBtn = document.getElementById('snapshot-btn');
  const revertBtn = document.getElementById('revert-btn');
  const randomizeBtn = document.getElementById('randomize-btn');
  const saveBtn = document.getElementById('save-btn');
  const loadBtn = document.getElementById('load-btn');
  const loadInput = document.getElementById('load-input');
  const detailEl = document.getElementById('detail');
  const detailIdEl = document.getElementById('detail-id');
  const holdInput = document.getElementById('hold-input');
  const transInput = document.getElementById('trans-input');
  const deleteBtn = document.getElementById('delete-btn');
  const duplicateBtn = document.getElementById('duplicate-btn');
  const moveLeftBtn = document.getElementById('move-left-btn');
  const moveRightBtn = document.getElementById('move-right-btn');
  const zoomInBtn = document.getElementById('zoom-in-btn');
  const zoomOutBtn = document.getElementById('zoom-out-btn');
  const metaCount = document.getElementById('meta-count');
  const metaTime = document.getElementById('meta-time');

  // ====== Canvas sizing ======
  let W = 0, H = 0;
  let lastSkyW = -1, lastSkyH = -1;
  let lastTlW = -1, lastTlH = -1;
  function ensureCanvasSizes() {
    const dpr = window.devicePixelRatio || 1;
    const skyRect = sky.getBoundingClientRect();
    if (skyRect.width !== lastSkyW || skyRect.height !== lastSkyH) {
      sky.width = Math.max(1, skyRect.width * dpr);
      sky.height = Math.max(1, skyRect.height * dpr);
      skyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = skyRect.width; H = skyRect.height;
      lastSkyW = skyRect.width; lastSkyH = skyRect.height;
    }
    // Timeline canvas: explicit width = max(container, totalDuration * zoom + pad)
    const containerW = tlScroll.clientWidth;
    const tlH = tlScroll.clientHeight;
    const wantedW = Math.max(containerW, Math.ceil(totalDuration() * timelineZoom + TL_PAD_LEFT + TL_PAD_RIGHT));
    if (tlCanvas.style.width !== wantedW + 'px') tlCanvas.style.width = wantedW + 'px';
    if (tlCanvas.style.height !== tlH + 'px') tlCanvas.style.height = tlH + 'px';
    if (wantedW !== lastTlW || tlH !== lastTlH) {
      tlCanvas.width = Math.max(1, wantedW * dpr);
      tlCanvas.height = Math.max(1, tlH * dpr);
      tlCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lastTlW = wantedW; lastTlH = tlH;
    }
  }

  // ====== Background stars ======
  const bgStars = [];
  for (let i = 0; i < 220; i++) {
    bgStars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.1 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
    });
  }

  // ====== Live state ======
  const STAR_NAMES = ['Mercurius', 'Venus', 'Mars', 'Iuppiter', 'Saturnus', 'Uranus', 'Neptunus', 'Pluto'];
  // Per-planet visual flavor — kept identical between index.html and admin.html
  const PLANET_SIZES = [6, 9, 7, 12, 11, 9, 9, 5];
  // Eight equidistant hues at S=0.40, V=1.0 — light, star-like tints.
  // Hues are reordered so each planet gets the closest natural shade.
  const PLANET_COLORS = [
    [204, 153, 255], // Mercurius — 270° pale violet (cool/distant)
    [255, 230, 153], // Venus     —  45° pale yellow
    [255, 153, 153], // Mars      —   0° pale red
    [204, 255, 153], // Iuppiter  —  90° pale yellow-green
    [153, 255, 179], // Saturnus  — 135° pale green-gold
    [153, 255, 255], // Uranus    — 180° pale cyan
    [153, 179, 255], // Neptunus  — 225° pale blue
    [255, 153, 230], // Pluto     — 315° pale pink
  ];
  const liveStars = [];
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    liveStars.push({ id: i, x: 0.5 + Math.cos(a) * 0.32, y: 0.5 + Math.sin(a) * 0.32, radius: PLANET_SIZES[i] });
  }
  const wheel = { cx: 0.80, cy: 1.0, R: 0.18, bodySize: 17, angle: Math.PI }; // start full-volume
  let dragWheelOffset = 0;

  // ====== Score state ======
  // Each snapshot: { stars: [{x,y}*8], wheelAngle, hold (s), transition (s) }
  const score = { snapshots: [] };
  let selectedIndex = null;
  let currentTime = 0;          // in seconds
  let isPlaying = false;
  let isMuted = false;
  let playStartedReal = 0;
  let playStartedAtTime = 0;
  let timelineZoom = 30;        // px per second
  const TL_PAD_LEFT = 16;
  const TL_PAD_RIGHT = 80;
  const TL_SCRUB_STRIP_H = 28;   // top strip dedicated to playhead scrubbing

  function totalDuration() {
    if (score.snapshots.length === 0) return 0;
    let t = 0;
    for (let i = 0; i < score.snapshots.length - 1; i++) {
      t += score.snapshots[i].hold + score.snapshots[i].transition;
    }
    t += score.snapshots[score.snapshots.length - 1].hold;
    return t;
  }
  function snapshotStartTime(i) {
    let t = 0;
    for (let j = 0; j < i; j++) t += score.snapshots[j].hold + score.snapshots[j].transition;
    return t;
  }
  function getSegmentForTime(t) {
    if (score.snapshots.length === 0) return null;
    if (score.snapshots.length === 1) return { from: 0, to: 0, u: 0 };
    let acc = 0;
    for (let i = 0; i < score.snapshots.length; i++) {
      const s = score.snapshots[i];
      const holdEnd = acc + s.hold;
      if (t < holdEnd) return { from: i, to: i, u: 0 };
      const transEnd = holdEnd + s.transition;
      if (i + 1 < score.snapshots.length && t < transEnd) {
        const u = s.transition > 0 ? (t - holdEnd) / s.transition : 0;
        return { from: i, to: i + 1, u };
      }
      acc = transEnd;
    }
    return { from: score.snapshots.length - 1, to: score.snapshots.length - 1, u: 0 };
  }
  function shortDelta(a, b) {
    return ((b - a) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  }
  function applyTimeToLive(t) {
    if (score.snapshots.length === 0) return;
    const seg = getSegmentForTime(t);
    const a = score.snapshots[seg.from];
    const b = score.snapshots[seg.to];
    const eased = 0.5 - 0.5 * Math.cos(Math.PI * seg.u);
    for (let i = 0; i < 8; i++) {
      liveStars[i].x = a.stars[i].x + (b.stars[i].x - a.stars[i].x) * eased;
      liveStars[i].y = a.stars[i].y + (b.stars[i].y - a.stars[i].y) * eased;
    }
    const dw = shortDelta(a.wheelAngle, b.wheelAngle);
    wheel.angle = ((a.wheelAngle + dw * eased) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  }

  function captureSnapshot() {
    const snap = {
      stars: liveStars.map(s => ({ x: s.x, y: s.y })),
      wheelAngle: wheel.angle,
      hold: 10,
      transition: 30,
    };
    const TOL = 1e-3;

    // Empty score: just push.
    if (score.snapshots.length === 0) {
      score.snapshots.push(snap);
      selectSnapshot(0);
      fitTimelineZoom();
      refreshUI();
      return;
    }

    // Past the end: append.
    const total = totalDuration();
    if (currentTime >= total - TOL) {
      score.snapshots.push(snap);
      selectSnapshot(score.snapshots.length - 1);
      fitTimelineZoom();
      refreshUI();
      return;
    }

    // Insert at the playhead. Find which segment currentTime lives in and
    // splice the new snapshot so it begins exactly at currentTime, adjusting
    // the previous snapshot's hold or transition so the times line up.
    const seg = getSegmentForTime(currentTime);
    const fromIdx = seg.from;
    const fromSnap = score.snapshots[fromIdx];
    const segStart = snapshotStartTime(fromIdx);

    if (seg.from === seg.to) {
      // Inside the hold of fromSnap.
      const intoHold = currentTime - segStart;
      if (intoHold < TOL) {
        // We're sitting right on fromSnap's start — insert before it so the
        // new snapshot occupies this moment and fromSnap shifts forward.
        score.snapshots.splice(fromIdx, 0, snap);
        selectSnapshot(fromIdx);
      } else {
        // Cut the hold short at the playhead. fromSnap's transition becomes
        // 0 so the new snap takes over immediately.
        fromSnap.hold = intoHold;
        fromSnap.transition = 0;
        score.snapshots.splice(fromIdx + 1, 0, snap);
        selectSnapshot(fromIdx + 1);
      }
    } else {
      // Inside the transition from fromSnap to fromSnap+1. Shorten the
      // transition so it ends right at the playhead, then drop the new
      // snapshot in between.
      const intoTrans = currentTime - (segStart + fromSnap.hold);
      fromSnap.transition = intoTrans;
      score.snapshots.splice(fromIdx + 1, 0, snap);
      selectSnapshot(fromIdx + 1);
    }
    fitTimelineZoom();
    refreshUI();
  }
  function selectSnapshot(i) {
    if (i === null || i < 0 || i >= score.snapshots.length) {
      selectedIndex = null;
      detailEl.classList.add('hidden');
      return;
    }
    selectedIndex = i;
    const s = score.snapshots[i];
    for (let j = 0; j < 8; j++) {
      liveStars[j].x = s.stars[j].x;
      liveStars[j].y = s.stars[j].y;
    }
    wheel.angle = s.wheelAngle;
    currentTime = snapshotStartTime(i);
    detailIdEl.textContent = `#${i + 1}`;
    holdInput.value = s.hold;
    transInput.value = s.transition;
    detailEl.classList.remove('hidden');
    refreshUI();
  }
  function deleteSelected() {
    if (selectedIndex === null) return;
    const i = selectedIndex;
    const removed = score.snapshots[i];
    score.snapshots.splice(i, 1);
    // Stretch the previous snapshot's transition to absorb the deleted one's
    // hold + transition. Trajectories from the previous to next snapshot now
    // run uninterrupted across that combined duration.
    if (i > 0 && i - 1 < score.snapshots.length) {
      score.snapshots[i - 1].transition += removed.hold + removed.transition;
    }
    if (score.snapshots.length === 0) {
      selectSnapshot(null);
      currentTime = 0;
    } else {
      const next = Math.min(i, score.snapshots.length - 1);
      selectSnapshot(next);
    }
    fitTimelineZoom();
    refreshUI();
  }
  function moveSelected(dir) {
    if (selectedIndex === null) return;
    const i = selectedIndex;
    const j = i + dir;
    if (j < 0 || j >= score.snapshots.length) return;
    const snaps = score.snapshots;
    [snaps[i], snaps[j]] = [snaps[j], snaps[i]];
    selectSnapshot(j);
    refreshUI();
  }
  function duplicateSelected() {
    if (selectedIndex === null) return;
    const src = score.snapshots[selectedIndex];
    const copy = {
      stars: src.stars.map(p => ({ x: p.x, y: p.y })),
      wheelAngle: src.wheelAngle,
      hold: src.hold,
      transition: src.transition,
    };
    score.snapshots.splice(selectedIndex + 1, 0, copy);
    selectSnapshot(selectedIndex + 1);
    fitTimelineZoom();
    refreshUI();
  }
  function randomizeStars() {
    // Edits live state only. The user must press "Capture snapshot" to
    // commit, or "Revert edits" to discard.
    for (let j = 0; j < 8; j++) {
      liveStars[j].x = 0.05 + Math.random() * 0.9;
      liveStars[j].y = 0.05 + Math.random() * 0.9;
    }
  }
  function revertEdits() {
    // Pull live star/wheel state back from whatever the timeline says it
    // should be at the current playhead position.
    if (score.snapshots.length === 0) return;
    applyTimeToLive(currentTime);
  }
  function play() {
    if (score.snapshots.length === 0) return;
    if (currentTime >= totalDuration() - 1e-3) currentTime = 0;
    isPlaying = true;
    playStartedReal = performance.now();
    playStartedAtTime = currentTime;
    if (!audio) audio = setupAudio();
    playBtn.textContent = '❚❚ Pause';
    selectSnapshot(null); // exit edit mode while playing
  }
  function pauseScore() {
    isPlaying = false;
    playBtn.textContent = '▶ Play';
  }
  function togglePlay() { isPlaying ? pauseScore() : play(); }
  function rewind() {
    pauseScore();
    currentTime = 0;
    if (score.snapshots.length > 0) applyTimeToLive(0);
    refreshUI();
  }
  function setHold(v) {
    if (selectedIndex === null) return;
    score.snapshots[selectedIndex].hold = Math.max(0, Number(v) || 0);
    refreshUI();
  }
  function setTransition(v) {
    if (selectedIndex === null) return;
    score.snapshots[selectedIndex].transition = Math.max(0, Number(v) || 0);
    refreshUI();
  }
  function saveScore() {
    const blob = new Blob([JSON.stringify(score, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'score.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function applyScoreData(parsed) {
    if (!parsed || !Array.isArray(parsed.snapshots)) throw new Error('missing snapshots array');
    score.snapshots = parsed.snapshots.map(s => ({
      stars: s.stars.map(p => ({ x: Number(p.x), y: Number(p.y) })),
      wheelAngle: typeof s.wheelAngle === 'number' ? s.wheelAngle : Math.PI,
      hold: typeof s.hold === 'number' ? Math.max(0, s.hold) : 0,
      transition: typeof s.transition === 'number' ? Math.max(0, s.transition) : 30,
    }));
    currentTime = 0;
    selectSnapshot(null);
    if (score.snapshots.length > 0) applyTimeToLive(0);
    fitTimelineZoom();
    refreshUI();
  }
  function loadScoreFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        applyScoreData(JSON.parse(reader.result));
      } catch (e) {
        alert('Failed to load score: ' + e.message);
      }
    };
    reader.readAsText(file);
  }
  // Auto-load score.json from the same directory on startup. Silently no-ops
  // if the file is missing or the page was opened over file:// where fetch
  // can't read sibling files.
  function autoLoadDefaultScore() {
    fetch('score.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data) applyScoreData(data); })
      .catch(() => {});
  }
  function toggleFullscreen() {
    const wrap = document.getElementById('sky-wrap');
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }

  function fmt(s) {
    if (!isFinite(s)) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }
  function refreshUI() {
    metaCount.textContent = score.snapshots.length;
    metaTime.textContent = `${fmt(currentTime)} / ${fmt(totalDuration())}`;
    if (selectedIndex !== null && score.snapshots[selectedIndex]) {
      detailIdEl.textContent = `#${selectedIndex + 1}`;
      const s = score.snapshots[selectedIndex];
      // Don't stomp values while user is typing
      if (document.activeElement !== holdInput) holdInput.value = s.hold;
      if (document.activeElement !== transInput) transInput.value = s.transition;
      moveLeftBtn.disabled = selectedIndex === 0;
      moveRightBtn.disabled = selectedIndex === score.snapshots.length - 1;
    }
  }

  // ====== Web Audio (same patch as the main page) ======
  let audio = null;
  function setupAudio() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = ctx.createOscillator(); osc1.type = 'sawtooth';
    const osc1Gain = ctx.createGain(); osc1Gain.gain.value = 0.15;
    const osc2 = ctx.createOscillator(); osc2.type = 'square';
    const osc2Gain = ctx.createGain(); osc2Gain.gain.value = 0.12;
    const lfo1 = ctx.createOscillator(); lfo1.type = 'sine';
    const lfo1Depth = ctx.createGain(); lfo1Depth.gain.value = 0;
    lfo1.connect(lfo1Depth); lfo1Depth.connect(osc1.frequency);
    const lfo2 = ctx.createOscillator(); lfo2.type = 'triangle';
    const lfo2Depth = ctx.createGain(); lfo2Depth.gain.value = 0;
    lfo2.connect(lfo2Depth);
    const crossMod = ctx.createGain(); crossMod.gain.value = 200;
    osc1.connect(crossMod); crossMod.connect(osc2.detune);
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = noiseBuf; noise.loop = true;
    const noiseFilter = ctx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.Q.value = 4;
    const noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain);
    const sampleGain = ctx.createGain(); sampleGain.gain.value = 0;
    const preFilter = ctx.createGain();
    osc1.connect(osc1Gain).connect(preFilter);
    osc2.connect(osc2Gain).connect(preFilter);
    noiseGain.connect(preFilter);
    sampleGain.connect(preFilter);
    const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 1500; lpf.Q.value = 1;
    preFilter.connect(lpf);
    lfo2Depth.connect(lpf.frequency);
    const delay = ctx.createDelay(1.5); delay.delayTime.value = 0.25;
    const feedback = ctx.createGain(); feedback.gain.value = 0.35;
    const wet = ctx.createGain(); wet.gain.value = 0.4;
    lpf.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(wet);
    const master = ctx.createGain(); master.gain.value = 0;
    lpf.connect(master); wet.connect(master);
    const muteGain = ctx.createGain(); muteGain.gain.value = isMuted ? 0 : 1;
    master.connect(muteGain); muteGain.connect(ctx.destination);
    osc1.start(); osc2.start(); lfo1.start(); lfo2.start(); noise.start();
    master.gain.setTargetAtTime(0.5, ctx.currentTime, 0.3);
    return { ctx, osc1, osc2, osc1Gain, osc2Gain, lfo1, lfo2, lfo1Depth, lfo2Depth,
      noise, noiseFilter, noiseGain, sampleGain, lpf, delay, feedback, wet, master, muteGain, crossMod };
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function expMap(t, lo, hi) { return lo * Math.pow(hi / lo, t); }
  function applyParams() {
    if (!audio) return;
    const t = audio.ctx.currentTime;
    const tc = 0.05;
    const s = liveStars;
    audio.osc1.frequency.setTargetAtTime(expMap(1 - s[0].y, 55, 880), t, tc);
    audio.osc1.detune.setTargetAtTime(lerp(-1200, 1200, s[0].x), t, tc);
    audio.osc2.frequency.setTargetAtTime(expMap(1 - s[1].y, 55, 880), t, tc);
    audio.osc2.detune.setTargetAtTime(lerp(-1200, 1200, s[1].x), t, tc);
    audio.lfo1.frequency.setTargetAtTime(expMap(s[2].x, 0.1, 30), t, tc);
    audio.lfo1Depth.gain.setTargetAtTime((1 - s[2].y) * 250, t, tc);
    audio.lfo2.frequency.setTargetAtTime(expMap(s[3].x, 0.05, 18), t, tc);
    audio.lfo2Depth.gain.setTargetAtTime((1 - s[3].y) * 3500, t, tc);
    audio.lpf.frequency.setTargetAtTime(expMap(s[4].x, 80, 12000), t, tc);
    audio.lpf.Q.setTargetAtTime(lerp(0.4, 18, 1 - s[4].y), t, tc);
    audio.delay.delayTime.setTargetAtTime(lerp(0.02, 0.95, s[5].x), t, tc);
    audio.feedback.gain.setTargetAtTime(lerp(0, 0.85, 1 - s[5].y), t, tc);
    audio.noiseFilter.frequency.setTargetAtTime(expMap(s[6].x, 100, 12000), t, tc);
    audio.noiseGain.gain.setTargetAtTime(lerp(0, 0.4, 1 - s[6].y), t, tc);
    audio.sampleGain.gain.setTargetAtTime(lerp(0, 0.5, 1 - s[7].y), t, tc);
    let chaos = 0;
    for (const st of s) { const dx = st.x - 0.5, dy = st.y - 0.5; chaos += Math.sqrt(dx*dx + dy*dy); }
    audio.crossMod.gain.setTargetAtTime(chaos * 80, t, tc);
    const raw = (1 - Math.cos(wheel.angle)) / 2;
    const e0 = 0.30, e1 = 0.70;
    const xv = Math.max(0, Math.min(1, (raw - e0) / (e1 - e0)));
    const audioAmount = xv * xv * (3 - 2 * xv);
    audio.master.gain.setTargetAtTime(audioAmount * 0.5, t, 0.04);
  }

  // ====== Sky drawing (lifted from index.html) ======
  function lerpColor(c1, c2, t) {
    return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  }
  function rgb(c, a = 1) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
  function drawSky(time) {
    skyCtx.clearRect(0, 0, W, H);
    const nightness = (1 - Math.cos(wheel.angle)) / 2;
    const twilight = 1 - Math.abs(nightness - 0.5) * 2;
    const dayTop = [120, 175, 220], dayBot = [220, 230, 240];
    const duskTop = [60, 40, 90], duskBot = [220, 110, 80];
    const nightTop = [10, 8, 30], nightBot = [25, 18, 55];
    const topNow = lerpColor(lerpColor(dayTop, duskTop, twilight), nightTop, nightness);
    const botNow = lerpColor(lerpColor(dayBot, duskBot, twilight), nightBot, nightness);
    const skyGrad = skyCtx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, rgb(topNow));
    skyGrad.addColorStop(1, rgb(botNow));
    skyCtx.fillStyle = skyGrad;
    skyCtx.fillRect(0, 0, W, H);

    document.body.style.background = `linear-gradient(to bottom, ${rgb(topNow)}, ${rgb(botNow)})`;
    const dayText = [22, 26, 50], nightText = [220, 222, 240];
    const dayMuted = [70, 80, 120], nightMuted = [160, 165, 200];
    document.body.style.setProperty('--text-primary', rgb(lerpColor(dayText, nightText, nightness)));
    document.body.style.setProperty('--text-muted', rgb(lerpColor(dayMuted, nightMuted, nightness)));

    if (nightness > 0.4) {
      const grad = skyCtx.createRadialGradient(
        W * (0.3 + Math.sin(time * 0.0002) * 0.05), H * 0.2, 50,
        W * 0.5, H * 0.5, Math.max(W, H));
      const na = (nightness - 0.4) / 0.6;
      grad.addColorStop(0, `rgba(40, 30, 90, ${0.35 * na})`);
      grad.addColorStop(0.5, `rgba(15, 10, 40, ${0.1 * na})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      skyCtx.fillStyle = grad;
      skyCtx.fillRect(0, 0, W, H);
    }

    const starAlpha = Math.max(0, (nightness - 0.3) / 0.7);
    if (starAlpha > 0) {
      for (const s of bgStars) {
        s.twinkle += s.speed;
        const a = (0.4 + 0.5 * Math.sin(s.twinkle)) * starAlpha;
        skyCtx.beginPath();
        skyCtx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        skyCtx.fillStyle = `rgba(220, 230, 255, ${a})`;
        skyCtx.fill();
      }
    }

    const activeAlpha = Math.max(0.18, nightness);
    for (const s of liveStars) {
      const pulse = 1 + Math.sin(time * 0.003 + s.id) * 0.15;
      const r = s.radius * pulse;
      const c = PLANET_COLORS[s.id];
      const halo = skyCtx.createRadialGradient(s.x*W, s.y*H, 0, s.x*W, s.y*H, r * 5);
      halo.addColorStop(0, `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${0.6 * activeAlpha})`);
      halo.addColorStop(0.4, `rgba(180, 200, 255, ${0.15 * activeAlpha})`);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      skyCtx.fillStyle = halo;
      skyCtx.beginPath();
      skyCtx.arc(s.x * W, s.y * H, r * 5, 0, Math.PI * 2);
      skyCtx.fill();

      skyCtx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${activeAlpha})`;
      skyCtx.beginPath();
      skyCtx.arc(s.x * W, s.y * H, r, 0, Math.PI * 2);
      skyCtx.fill();

      skyCtx.strokeStyle = `rgba(255, 250, 230, ${0.8 * activeAlpha})`;
      skyCtx.lineWidth = 1;
      const sp = r * 3.2;
      skyCtx.beginPath();
      skyCtx.moveTo(s.x*W - sp, s.y*H);
      skyCtx.lineTo(s.x*W + sp, s.y*H);
      skyCtx.moveTo(s.x*W, s.y*H - sp);
      skyCtx.lineTo(s.x*W, s.y*H + sp);
      skyCtx.stroke();

      const labelAlpha = 0.55 * activeAlpha + 0.3;
      skyCtx.font = '300 12px -apple-system, BlinkMacSystemFont, sans-serif';
      skyCtx.textAlign = 'left';
      skyCtx.textBaseline = 'middle';
      const lx = s.x * W + s.radius * 1.8 + 6;
      const ly = s.y * H - s.radius * 1.8 - 4;
      skyCtx.fillStyle = `rgba(235, 230, 215, ${labelAlpha})`;
      skyCtx.fillText(STAR_NAMES[s.id], lx, ly);
      skyCtx.textBaseline = 'alphabetic';
    }

    // Day/night wheel
    const wc = { x: wheel.cx * W, y: wheel.cy * H, R: wheel.R * Math.min(W, H) };
    const Rorb = wc.R;
    const sunPos  = { x: wc.x + Math.sin(wheel.angle) * Rorb,  y: wc.y - Math.cos(wheel.angle) * Rorb };
    const moonPos = { x: wc.x - Math.sin(wheel.angle) * Rorb,  y: wc.y + Math.cos(wheel.angle) * Rorb };

    skyCtx.strokeStyle = 'rgba(220, 220, 240, 0.12)';
    skyCtx.lineWidth = 1;
    skyCtx.setLineDash([2, 4]);
    skyCtx.beginPath();
    skyCtx.arc(wc.x, wc.y, Rorb, 0, Math.PI * 2);
    skyCtx.stroke();
    skyCtx.setLineDash([]);

    skyCtx.strokeStyle = 'rgba(220, 220, 240, 0.22)';
    skyCtx.lineWidth = 1.5;
    skyCtx.beginPath();
    skyCtx.moveTo(sunPos.x, sunPos.y);
    skyCtx.lineTo(moonPos.x, moonPos.y);
    skyCtx.stroke();

    skyCtx.fillStyle = 'rgba(220, 220, 240, 0.4)';
    skyCtx.beginPath();
    skyCtx.arc(wc.x, wc.y, 2.5, 0, Math.PI * 2);
    skyCtx.fill();

    const sunUp = (1 + Math.cos(wheel.angle)) / 2;
    const moonUp = 1 - sunUp;
    const sunRadius = wheel.bodySize;
    const sunCol = lerpColor([180, 80, 60], [255, 240, 190], sunUp);
    const sunGlowR = sunRadius * (1.5 + sunUp * 4);
    const sg = skyCtx.createRadialGradient(sunPos.x, sunPos.y, 0, sunPos.x, sunPos.y, sunGlowR);
    sg.addColorStop(0, rgb(sunCol, 0.35 + sunUp * 0.45));
    sg.addColorStop(0.4, rgb(sunCol, 0.1 + sunUp * 0.15));
    sg.addColorStop(1, rgb(sunCol, 0));
    skyCtx.fillStyle = sg;
    skyCtx.beginPath();
    skyCtx.arc(sunPos.x, sunPos.y, sunGlowR, 0, Math.PI * 2);
    skyCtx.fill();

    skyCtx.fillStyle = rgb(sunCol);
    skyCtx.beginPath();
    skyCtx.arc(sunPos.x, sunPos.y, sunRadius, 0, Math.PI * 2);
    skyCtx.fill();
    if (sunUp > 0.2) {
      const hi = skyCtx.createRadialGradient(sunPos.x - 5, sunPos.y - 5, 0, sunPos.x, sunPos.y, sunRadius);
      hi.addColorStop(0, `rgba(255,255,240,${0.65 * sunUp})`);
      hi.addColorStop(1, 'rgba(255,255,240,0)');
      skyCtx.fillStyle = hi;
      skyCtx.beginPath();
      skyCtx.arc(sunPos.x, sunPos.y, sunRadius, 0, Math.PI * 2);
      skyCtx.fill();
    }

    const moonRadius = wheel.bodySize;
    const moonCol = lerpColor([90, 90, 110], [230, 235, 250], moonUp);
    const moonGlowR = moonRadius * (1.4 + moonUp * 3);
    const mg = skyCtx.createRadialGradient(moonPos.x, moonPos.y, 0, moonPos.x, moonPos.y, moonGlowR);
    mg.addColorStop(0, rgb(moonCol, 0.25 + moonUp * 0.35));
    mg.addColorStop(0.5, rgb(moonCol, 0.05 + moonUp * 0.1));
    mg.addColorStop(1, rgb(moonCol, 0));
    skyCtx.fillStyle = mg;
    skyCtx.beginPath();
    skyCtx.arc(moonPos.x, moonPos.y, moonGlowR, 0, Math.PI * 2);
    skyCtx.fill();

    skyCtx.fillStyle = rgb(moonCol);
    skyCtx.beginPath();
    skyCtx.arc(moonPos.x, moonPos.y, moonRadius, 0, Math.PI * 2);
    skyCtx.fill();
    if (moonUp > 0.05) {
      skyCtx.fillStyle = `rgba(20, 20, 35, ${0.55 * moonUp})`;
      skyCtx.beginPath();
      skyCtx.arc(moonPos.x + moonRadius * 0.45, moonPos.y - moonRadius * 0.15, moonRadius * 0.95, 0, Math.PI * 2);
      skyCtx.fill();
    }
  }

  // ====== Timeline drawing ======
  // Renders a tiny snapshot of the sky scene next to a marker. cx is the
  // marker's x (start of the snapshot's hold) — the preview is centered on it
  // and sits in topY..topY+size.
  function drawSnapshotPreview(snap, cx, topY, size) {
    const left = cx - size / 2;
    const angle = snap.wheelAngle;
    const nightness = (1 - Math.cos(angle)) / 2;
    const twilight = 1 - Math.abs(nightness - 0.5) * 2;
    const topC = lerpColor(lerpColor([120, 175, 220], [60, 40, 90], twilight), [10, 8, 30], nightness);
    const botC = lerpColor(lerpColor([220, 230, 240], [220, 110, 80], twilight), [25, 18, 55], nightness);

    tlCtx.save();
    tlCtx.beginPath();
    tlCtx.rect(left, topY, size, size);
    tlCtx.clip();

    const grad = tlCtx.createLinearGradient(left, topY, left, topY + size);
    grad.addColorStop(0, rgb(topC));
    grad.addColorStop(1, rgb(botC));
    tlCtx.fillStyle = grad;
    tlCtx.fillRect(left, topY, size, size);

    const starAlpha = Math.max(0.55, nightness);
    for (const s of snap.stars) {
      const sx = left + s.x * size;
      const sy = topY + s.y * size;
      tlCtx.fillStyle = `rgba(255, 240, 200, ${0.3 * starAlpha})`;
      tlCtx.beginPath();
      tlCtx.arc(sx, sy, 2.5, 0, Math.PI * 2);
      tlCtx.fill();
      tlCtx.fillStyle = `rgba(255, 255, 255, ${starAlpha})`;
      tlCtx.beginPath();
      tlCtx.arc(sx, sy, 1.2, 0, Math.PI * 2);
      tlCtx.fill();
    }
    tlCtx.restore();

    tlCtx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
    tlCtx.lineWidth = 1;
    tlCtx.strokeRect(left + 0.5, topY + 0.5, size - 1, size - 1);
  }

  function drawTimeline() {
    const cssW = parseFloat(tlCanvas.style.width || '0');
    const cssH = parseFloat(tlCanvas.style.height || '0');
    if (!cssW || !cssH) return;
    tlCtx.clearRect(0, 0, cssW, cssH);

    const total = totalDuration();
    const barTop = 70, barBot = 130;
    const tickTop = 22;
    const previewSize = 36;
    const previewTop = barTop - 4 - previewSize;

    // Scrub strip background — visual cue that the top band is dedicated
    // to clicking/dragging the playhead anywhere along the timeline.
    tlCtx.fillStyle = 'rgba(60, 70, 110, 0.18)';
    tlCtx.fillRect(0, 0, cssW, TL_SCRUB_STRIP_H);
    tlCtx.strokeStyle = 'rgba(120, 140, 200, 0.25)';
    tlCtx.lineWidth = 1;
    tlCtx.beginPath();
    tlCtx.moveTo(0, TL_SCRUB_STRIP_H + 0.5);
    tlCtx.lineTo(cssW, TL_SCRUB_STRIP_H + 0.5);
    tlCtx.stroke();

    // Tick interval (seconds per major tick) chosen so ticks are roughly 80-120px apart
    const targetPx = 100;
    const candidates = [1, 2, 5, 10, 15, 30, 60, 120, 300];
    let interval = 30;
    for (const c of candidates) { if (c * timelineZoom >= targetPx) { interval = c; break; } }

    // Tick lines
    tlCtx.strokeStyle = 'rgba(120, 120, 180, 0.18)';
    tlCtx.fillStyle = 'rgba(160, 165, 200, 0.7)';
    tlCtx.font = '10px "SF Mono", Menlo, monospace';
    tlCtx.textAlign = 'left';
    tlCtx.textBaseline = 'top';
    const maxTime = Math.max(total + interval, interval * 2);
    for (let s = 0; s <= maxTime + interval; s += interval) {
      const x = TL_PAD_LEFT + s * timelineZoom;
      if (x > cssW) break;
      tlCtx.beginPath();
      tlCtx.moveTo(x, tickTop);
      tlCtx.lineTo(x, cssH - 8);
      tlCtx.stroke();
      tlCtx.fillText(fmt(s), x + 4, 4);
    }

    // Snapshot bars
    let acc = 0;
    for (let i = 0; i < score.snapshots.length; i++) {
      const sn = score.snapshots[i];
      const startX = TL_PAD_LEFT + acc * timelineZoom;
      const holdW = sn.hold * timelineZoom;
      const transW = sn.transition * timelineZoom;
      const isLast = i === score.snapshots.length - 1;

      // Hold rectangle
      if (holdW > 1) {
        tlCtx.fillStyle = i === selectedIndex ? 'rgba(255, 220, 130, 0.35)' : 'rgba(120, 140, 200, 0.22)';
        tlCtx.fillRect(startX, barTop, holdW, barBot - barTop);
      }
      // Transition rectangle (skip for last snapshot)
      if (!isLast && transW > 1) {
        const tx = startX + holdW;
        const grad = tlCtx.createLinearGradient(tx, 0, tx + transW, 0);
        if (i === selectedIndex || (i + 1) === selectedIndex) {
          grad.addColorStop(0, 'rgba(255, 220, 130, 0.18)');
          grad.addColorStop(1, 'rgba(255, 220, 130, 0.06)');
        } else {
          grad.addColorStop(0, 'rgba(120, 140, 200, 0.16)');
          grad.addColorStop(1, 'rgba(120, 140, 200, 0.04)');
        }
        tlCtx.fillStyle = grad;
        tlCtx.fillRect(tx, barTop, transW, barBot - barTop);
        // Dotted transition line
        tlCtx.strokeStyle = 'rgba(255, 220, 180, 0.4)';
        tlCtx.lineWidth = 1;
        tlCtx.setLineDash([3, 3]);
        tlCtx.beginPath();
        tlCtx.moveTo(tx, (barTop + barBot) / 2);
        tlCtx.lineTo(tx + transW, (barTop + barBot) / 2);
        tlCtx.stroke();
        tlCtx.setLineDash([]);
      }

      // Scene preview thumbnail above the marker — a tiny rendering of the
      // sky at this snapshot's wheel angle and star positions.
      drawSnapshotPreview(sn, startX, previewTop, previewSize);

      // Snapshot marker (circle at start)
      const cx = startX, cy = (barTop + barBot) / 2;
      const sel = i === selectedIndex;
      const radius = sel ? 11 : 8;
      const glow = tlCtx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.5);
      glow.addColorStop(0, sel ? 'rgba(255,220,140,0.55)' : 'rgba(200,210,255,0.3)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      tlCtx.fillStyle = glow;
      tlCtx.beginPath();
      tlCtx.arc(cx, cy, radius * 2.5, 0, Math.PI * 2);
      tlCtx.fill();

      tlCtx.fillStyle = sel ? '#241c10' : '#0e1124';
      tlCtx.strokeStyle = sel ? '#ffd88a' : 'rgba(180,190,230,0.7)';
      tlCtx.lineWidth = sel ? 2 : 1.2;
      tlCtx.beginPath();
      tlCtx.arc(cx, cy, radius, 0, Math.PI * 2);
      tlCtx.fill();
      tlCtx.stroke();

      // Snapshot index label
      tlCtx.fillStyle = sel ? '#ffe8a8' : 'rgba(220,225,245,0.85)';
      tlCtx.font = sel ? 'bold 11px -apple-system, sans-serif' : '11px -apple-system, sans-serif';
      tlCtx.textAlign = 'center';
      tlCtx.textBaseline = 'middle';
      tlCtx.fillText(String(i + 1), cx, cy);

      // Duration labels under bars
      if (holdW > 22) {
        tlCtx.fillStyle = 'rgba(220,225,245,0.55)';
        tlCtx.font = '9px "SF Mono", Menlo, monospace';
        tlCtx.textAlign = 'left';
        tlCtx.textBaseline = 'top';
        tlCtx.fillText(`hold ${sn.hold}s`, startX + 4, barBot + 4);
      }
      if (!isLast && transW > 30) {
        tlCtx.fillStyle = 'rgba(255,220,180,0.55)';
        tlCtx.font = '9px "SF Mono", Menlo, monospace';
        tlCtx.textAlign = 'left';
        tlCtx.textBaseline = 'top';
        tlCtx.fillText(`→ ${sn.transition}s`, startX + holdW + 4, barBot + 4);
      }

      acc += sn.hold + sn.transition;
    }

    // End marker
    if (score.snapshots.length > 0) {
      const endX = TL_PAD_LEFT + total * timelineZoom;
      tlCtx.strokeStyle = 'rgba(180, 200, 255, 0.5)';
      tlCtx.lineWidth = 1;
      tlCtx.beginPath();
      tlCtx.moveTo(endX, tickTop);
      tlCtx.lineTo(endX, cssH - 8);
      tlCtx.stroke();
    }

    // Playhead
    const phX = TL_PAD_LEFT + currentTime * timelineZoom;
    tlCtx.strokeStyle = '#ff5050';
    tlCtx.lineWidth = 2;
    tlCtx.beginPath();
    tlCtx.moveTo(phX, tickTop);
    tlCtx.lineTo(phX, cssH - 8);
    tlCtx.stroke();
    tlCtx.fillStyle = '#ff5050';
    tlCtx.beginPath();
    tlCtx.moveTo(phX - 6, tickTop);
    tlCtx.lineTo(phX + 6, tickTop);
    tlCtx.lineTo(phX, tickTop + 8);
    tlCtx.closePath();
    tlCtx.fill();

    // Empty-state message
    if (score.snapshots.length === 0) {
      tlCtx.fillStyle = 'rgba(160, 165, 200, 0.55)';
      tlCtx.font = '13px -apple-system, sans-serif';
      tlCtx.textAlign = 'center';
      tlCtx.textBaseline = 'middle';
      tlCtx.fillText('Drag stars in the sky, then click "+ Capture snapshot" to start your score',
        cssW / 2, cssH / 2);
    }
  }

  // ====== Sky interaction ======
  function pointerSky(e) {
    const r = sky.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx / r.width, y: cy / r.height, px: cx, py: cy };
  }
  function findStar(p) {
    for (let i = liveStars.length - 1; i >= 0; i--) {
      const s = liveStars[i];
      const dx = (s.x - p.x) * W, dy = (s.y - p.y) * H;
      if (dx*dx + dy*dy < (s.radius + 8) ** 2) return s;
    }
    return null;
  }
  function wheelCenterPx() { return { x: wheel.cx * W, y: wheel.cy * H, R: wheel.R * Math.min(W, H) }; }
  function pointerWheelAngle(px, py) {
    const wc = wheelCenterPx();
    return Math.atan2(py - wc.y, px - wc.x) + Math.PI / 2;
  }
  function hitSun(p) {
    const wc = wheelCenterPx();
    const dx = wc.x - p.px, dy = wc.y - p.py;
    const dist = Math.sqrt(dx*dx + dy*dy);
    return dist > wc.R * 0.4 && dist < wc.R * 1.4 && p.py < wc.y + 8;
  }

  let dragging = null;
  let draggingSun = false;

  sky.addEventListener('mousedown', (e) => {
    if (!audio) audio = setupAudio();
    if (isPlaying) return;
    const p = pointerSky(e);
    const s = findStar(p);
    if (!s) {
      if (hitSun(p)) {
        draggingSun = true;
        const pa = pointerWheelAngle(p.px, p.py);
        dragWheelOffset = pa - wheel.angle;
        // If a snapshot is selected, dragging wheel updates it
      }
      return;
    }
    // Star drag — only meaningful if a snapshot is selected (so we know what to mutate).
    // If none is selected, still drag the live position so user can compose freely;
    // they'll need to capture a snapshot afterward.
    dragging = s;
  });
  // Drag updates the LIVE state only — snapshots are written on explicit
  // "Capture snapshot". Use "Revert edits" to discard local changes and
  // pull the timeline's current value back into the live state.
  window.addEventListener('mousemove', (e) => {
    if (draggingSun) {
      const p = pointerSky(e);
      const pa = pointerWheelAngle(p.px, p.py);
      let a = pa - dragWheelOffset;
      a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      wheel.angle = a;
      return;
    }
    if (dragging) {
      const p = pointerSky(e);
      dragging.x = Math.max(0.04, Math.min(0.96, p.x));
      dragging.y = Math.max(0.04, Math.min(0.96, p.y));
    }
  });
  window.addEventListener('mouseup', () => {
    dragging = null;
    draggingSun = false;
  });

  // ====== Timeline interaction ======
  function tlPointerTime(e) {
    const r = tlCanvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.max(0, (cx - TL_PAD_LEFT) / timelineZoom);
  }
  function tlPointerXY(e) {
    const r = tlCanvas.getBoundingClientRect();
    return {
      px: (e.touches ? e.touches[0].clientX : e.clientX) - r.left,
      py: (e.touches ? e.touches[0].clientY : e.clientY) - r.top,
    };
  }
  // Hit test: returns the snapshot whose visible region (marker + hold +
  // transition bars) contains px. Last snapshot has no transition bar so
  // its region is just hold. Falls back to the closest marker within 14px
  // when the cursor is between snapshots (e.g. a transition with 0 width).
  function findSnapshotAtX(px) {
    if (score.snapshots.length === 0) return -1;
    let acc = 0;
    let nearest = -1, nearestD = 14;
    for (let i = 0; i < score.snapshots.length; i++) {
      const s = score.snapshots[i];
      const startX = TL_PAD_LEFT + acc * timelineZoom;
      const isLast = i === score.snapshots.length - 1;
      const span = s.hold + (isLast ? 0 : s.transition);
      const endX = startX + span * timelineZoom;
      if (px >= startX && px < endX) return i;
      const d = Math.abs(startX - px);
      if (d < nearestD) { nearestD = d; nearest = i; }
      acc += s.hold + s.transition;
    }
    return nearest;
  }

  let tlScrubbing = false;
  // snapDrag: marker drag-to-reorder. Becomes "moved" once the cursor passes
  // SNAP_DRAG_THRESHOLD; otherwise the gesture is treated as a plain click.
  let snapDrag = null; // { startPx, idx, moved }
  const SNAP_DRAG_THRESHOLD = 5;

  function reorderTo(target) {
    if (target === snapDrag.idx) return;
    const item = score.snapshots[snapDrag.idx];
    score.snapshots.splice(snapDrag.idx, 1);
    score.snapshots.splice(target, 0, item);
    snapDrag.idx = target;
    selectedIndex = target;
    detailIdEl.textContent = `#${target + 1}`;
    currentTime = snapshotStartTime(target);
    refreshUI();
  }

  tlCanvas.addEventListener('mousedown', (e) => {
    if (!audio) audio = setupAudio();
    const xy = tlPointerXY(e);
    // Top strip is always playhead-scrub, regardless of what's beneath it.
    if (xy.py < TL_SCRUB_STRIP_H) {
      pauseScore();
      tlScrubbing = true;
      currentTime = Math.min(totalDuration(), tlPointerTime(e));
      applyTimeToLive(currentTime);
      selectSnapshot(null);
      refreshUI();
      return;
    }
    const idx = findSnapshotAtX(xy.px);
    if (idx >= 0) {
      pauseScore();
      selectSnapshot(idx);
      snapDrag = { startPx: xy.px, idx, moved: false };
    } else {
      pauseScore();
      tlScrubbing = true;
      currentTime = Math.min(totalDuration(), tlPointerTime(e));
      applyTimeToLive(currentTime);
      selectSnapshot(null);
      refreshUI();
    }
  });
  window.addEventListener('mousemove', (e) => {
    if (snapDrag) {
      const xy = tlPointerXY(e);
      if (!snapDrag.moved && Math.abs(xy.px - snapDrag.startPx) > SNAP_DRAG_THRESHOLD) {
        snapDrag.moved = true;
      }
      if (snapDrag.moved) {
        // Walk through the snapshots that are NOT the dragged one, accumulate
        // their start positions, and count how many sit left of the cursor —
        // that count is the insertion index in the post-splice array.
        let acc = 0, target = 0;
        for (let i = 0; i < score.snapshots.length; i++) {
          if (i === snapDrag.idx) continue;
          const cx = TL_PAD_LEFT + acc * timelineZoom;
          if (cx < xy.px) target++;
          acc += score.snapshots[i].hold + score.snapshots[i].transition;
        }
        if (target !== snapDrag.idx) reorderTo(target);
      }
      return;
    }
    if (!tlScrubbing) return;
    currentTime = Math.min(totalDuration(), tlPointerTime(e));
    applyTimeToLive(currentTime);
    refreshUI();
  });
  window.addEventListener('mouseup', () => {
    tlScrubbing = false;
    snapDrag = null;
  });

  function setZoom(z) {
    timelineZoom = Math.max(2, Math.min(400, z));
  }
  // Fit-to-view: pick a zoom level so (totalDuration + 30s) fits the
  // container. Used as the initial default and after a fresh score load.
  function fitTimelineZoom() {
    const containerW = tlScroll.clientWidth;
    if (!containerW) return;
    const span = Math.max(30, totalDuration() + 30);
    setZoom((containerW - TL_PAD_LEFT - TL_PAD_RIGHT) / span);
  }

  // ====== Buttons ======
  playBtn.addEventListener('click', () => {
    if (!audio) audio = setupAudio();
    togglePlay();
  });
  rewindBtn.addEventListener('click', rewind);
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    if (audio) audio.muteGain.gain.setTargetAtTime(isMuted ? 0 : 1, audio.ctx.currentTime, 0.01);
    muteBtn.textContent = isMuted ? '🔇 Unmute' : '🔊 Mute';
    muteBtn.setAttribute('aria-pressed', String(isMuted));
  });
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  snapshotBtn.addEventListener('click', () => {
    if (!audio) audio = setupAudio();
    captureSnapshot();
  });
  randomizeBtn.addEventListener('click', () => {
    if (!audio) audio = setupAudio();
    randomizeStars();
  });
  revertBtn.addEventListener('click', revertEdits);
  saveBtn.addEventListener('click', saveScore);
  loadBtn.addEventListener('click', () => loadInput.click());
  loadInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) loadScoreFile(f);
    loadInput.value = '';
  });
  deleteBtn.addEventListener('click', deleteSelected);
  duplicateBtn.addEventListener('click', duplicateSelected);
  moveLeftBtn.addEventListener('click', () => moveSelected(-1));
  moveRightBtn.addEventListener('click', () => moveSelected(1));
  zoomInBtn.addEventListener('click', () => setZoom(timelineZoom * 1.5));
  zoomOutBtn.addEventListener('click', () => setZoom(timelineZoom / 1.5));
  holdInput.addEventListener('input', (e) => setHold(e.target.value));
  transInput.addEventListener('input', (e) => setTransition(e.target.value));

  document.addEventListener('keydown', (e) => {
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') {
      if (selectedIndex !== null) { e.preventDefault(); deleteSelected(); }
    }
    else if (e.key === 'ArrowLeft' && selectedIndex !== null && selectedIndex > 0) {
      selectSnapshot(selectedIndex - 1);
    }
    else if (e.key === 'ArrowRight' && selectedIndex !== null && selectedIndex < score.snapshots.length - 1) {
      selectSnapshot(selectedIndex + 1);
    }
  });

  // ====== Loop ======
  function loop(time) {
    ensureCanvasSizes();
    if (isPlaying) {
      currentTime = playStartedAtTime + (time - playStartedReal) / 1000;
      const total = totalDuration();
      if (currentTime >= total) {
        currentTime = total;
        applyTimeToLive(currentTime);
        pauseScore();
      } else {
        applyTimeToLive(currentTime);
      }
      refreshUI();
    }
    drawSky(time);
    drawTimeline();
    applyParams();
    requestAnimationFrame(loop);
  }
  fitTimelineZoom();
  refreshUI();
  autoLoadDefaultScore();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
